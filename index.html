<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Creep</title>
    <meta name="description" content="Are newer Pokémon stronger? An interactive 3D look at 1,025 Pokémon across nine generations." />
    <meta name="theme-color" content="#0b0d14" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Power Creep: are Pokémon getting stronger?" />
    <meta property="og:description" content="An interactive data story about 1,025 Pokémon, nine generations and 28 years of base stats, built with three.js." />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="3D map of every Pokémon"></canvas>
    <div id="loader" role="status" aria-live="polite">
      <div class="loader-title">Power Creep</div>
      <div class="bar"><i></i></div>
      <p class="loader-text">Catching 1,025 Pokémon…</p>
      <noscript><p class="loader-text">This interactive story needs JavaScript.</p></noscript>
    </div>

    <header id="hud">
      <h1>Power Creep</h1>
      <p id="status">Loading Pokémon…</p>
      <button id="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-panel">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3 1.5V8.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        Filter <span class="badge" hidden></span>
      </button>
      <button id="story-btn" type="button">▶ Story</button>
    </header>
    <aside id="filter-panel" aria-label="Filters" hidden></aside>

    <nav id="layout-panel" aria-label="Layout">
      <div id="layout-bar" role="group"></div>
      <p id="layout-hint"></p>
    </nav>

    <main id="story" aria-label="Story"></main>
    <button id="skip-story" type="button">Skip to explore →</button>

    <div id="tooltip" class="card" hidden></div>
    <aside id="focus-card" class="card" hidden>
      <div id="voxel" title="Drag to turn"></div>
      <div class="focus-body"></div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
